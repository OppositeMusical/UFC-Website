<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{% block title %}MMA Assist{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/theme.css') }}" />
  {% block extra_css %}{% endblock %}
  <script nonce="{{ csp_nonce }}">
    // Applied before first paint so a collapsed sidebar never flashes open
    // on navigation. The class lands on <html>, which exists at this point;
    // <body> does not yet.
    if (localStorage.getItem("ufcpredictor:sidebar") === "collapsed") {
      document.documentElement.classList.add("sidebar-collapsed");
    }
  </script>
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar">
      <div class="sidebar__head">
        <a class="sidebar__brand" href="{{ url_for('main.dashboard') }}">
          <span class="sidebar__brand-mark">🥊</span>
          <span class="sidebar__brand-text">MMA <span>Assist</span></span>
        </a>
        <button class="sidebar__toggle" id="sidebar-toggle" title="Collapse sidebar" aria-label="Collapse sidebar" aria-expanded="true">
          <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"/>
            <path d="M9 4v16"/>
          </svg>
        </button>
      </div>
      <ul class="sidebar__nav">
        <li>
          <a href="{{ url_for('main.dashboard') }}" title="Dashboard" class="{{ 'active' if request.endpoint == 'main.dashboard' else '' }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="9"/><rect x="14" y="3" width="7" height="5"/><rect x="14" y="12" width="7" height="9"/><rect x="3" y="16" width="7" height="5"/></svg>
            <span class="sidebar__label">Dashboard</span>
          </a>
        </li>
        <li>
          <a href="{{ url_for('betting.form', platform='prizepicks') }}" title="PrizePicks" class="{{ 'active' if request.view_args and request.view_args.get('platform') == 'prizepicks' else '' }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2l2.4 7.4H22l-6 4.6 2.3 7.4-6.3-4.6L5.7 21 8 14 2 9.4h7.6z"/></svg>
            <span class="sidebar__label">PrizePicks</span>
          </a>
        </li>
        <li>
          <a href="{{ url_for('betting.form', platform='draftkings') }}" title="DraftKings" class="{{ 'active' if request.view_args and request.view_args.get('platform') == 'draftkings' else '' }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 20V10M8.5 20V4M14 20v-7M19.5 20V7"/></svg>
            <span class="sidebar__label">DraftKings</span>
          </a>
        </li>
        <li>
          <a href="{{ url_for('betting.form', platform='kalshi') }}" title="Kalshi" class="{{ 'active' if request.view_args and request.view_args.get('platform') == 'kalshi' else '' }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 16l5-6 4 4 4-7 5 5"/><path d="M3 21h18"/></svg>
            <span class="sidebar__label">Kalshi</span>
          </a>
        </li>
        <li>
          <a href="{{ url_for('chat.list_conversations') }}" title="Chat" class="{{ 'active' if request.endpoint and request.endpoint.startswith('chat.') else '' }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg>
            <span class="sidebar__label">Chat</span>
          </a>
        </li>
        <li>
          <a href="{{ url_for('settings.index') }}" title="Settings" class="{{ 'active' if request.endpoint == 'settings.index' else '' }}">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
            <span class="sidebar__label">Settings</span>
          </a>
        </li>
      </ul>
      <div class="sidebar__footer">Local-first &middot; Offline capable</div>
    </nav>
    <main class="main {% block main_class %}{% endblock %}">
      {% block content %}{% endblock %}
    </main>
  </div>
  <script src="{{ url_for('static', filename='js/common.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>
</html>
