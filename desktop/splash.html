<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline';" />
    <title>MMA Assist</title>
    <style>
      :root {
        --crimson: #e0263b;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.1rem;
        background: radial-gradient(ellipse at 50% 25%, #1a1013, #0a0a0c 70%);
        color: #f2f2f4;
        font-family: "Segoe UI", Roboto, Arial, sans-serif;
        border: 1px solid #2a2a30;
        user-select: none;
      }
      .glove {
        width: 68px;
        height: 68px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.9rem;
        background: radial-gradient(circle at 30% 30%, rgba(224, 38, 59, 0.45), rgba(143, 28, 40, 0.15));
        border: 1px solid #8f1c28;
        box-shadow: 0 0 40px rgba(224, 38, 59, 0.35);
        animation: float 2.6s ease-in-out infinite;
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-8px); }
      }
      h1 {
        margin: 0;
        font-size: 1.05rem;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }
      h1 span { color: var(--crimson); }
      p {
        margin: 0;
        font-size: 0.8rem;
        color: #9a9aa2;
      }
      .bar {
        width: 190px;
        height: 3px;
        border-radius: 999px;
        background: #24242a;
        overflow: hidden;
      }
      .bar::after {
        content: "";
        display: block;
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, transparent, var(--crimson), transparent);
        animation: slide 1.3s ease-in-out infinite;
      }
      @keyframes slide {
        from { transform: translateX(-110%); }
        to { transform: translateX(260%); }
      }
      @media (prefers-reduced-motion: reduce) {
        .glove, .bar::after { animation: none; }
      }
    </style>
  </head>
  <body>
    <div class="glove">🥊</div>
    <h1>MMA <span>Assist</span></h1>
    <div class="bar"></div>
    <!-- First launch has to load the ONNX embedding model and open a
         25MB Chroma index, so this can take a few seconds. -->
    <p>Starting local server&hellip;</p>
  </body>
</html>
